<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Paper Trading - Multi-Strategy Instance</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="riskCalculator.js"></script>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; background: #131722; color: #d1d4dc; }
    .header { padding: 10px 20px; background: #1e222d; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #2a2e39; flex-wrap: wrap; font-size: 12px; }
    .header label { display: flex; flex-direction: column; gap: 3px; font-weight: bold; color: #848e9c; }
    input, select { background: #2a2e39; color: #fff; border: 1px solid #434651; padding: 6px; border-radius: 4px; width: 95px; }
    button { background: #089981; color: #fff; cursor: pointer; border: none; font-weight: bold; padding: 8px 14px; border-radius: 4px; height: 32px; align-self: flex-end; }
    button:hover { background: #067765; }
    .stop-btn { background: #f23645 !important; }
    .stop-btn:hover { background: #d92b3a !important; }
    .home-link { background: #2a2e39; color: #fff; text-decoration: none; padding: 0 12px; border-radius: 4px; font-weight: bold; height: 32px; display: inline-flex; align-items: center; border: 1px solid #434651; margin-right: 5px; }
    .container { display: flex; height: calc(100vh - 65px); }
    #chart { flex: 1; height: 100%; }
    .sidebar { width: 440px; background: #1e222d; border-left: 1px solid #2a2e39; padding: 15px; box-sizing: border-box; overflow-y: auto; }
    .metric { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #2a2e39; padding-bottom: 4px; font-size: 13px; }
    .metric-value { font-weight: bold; }
    .green { color: #089981; } .red { color: #f23645; }
    .status-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }
    .status-running { background: rgba(8, 153, 129, 0.2); color: #089981; border: 1px solid #089981; }
    .status-stopped { background: rgba(242, 54, 69, 0.2); color: #f23645; border: 1px solid #f23645; }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="home-link">🏠 Hub</a>
    <label>Strategy Name / ID 
      <input type="text" id="strategyId" value="Strategy_X_5" style="width: 120px;">
    </label>
    <label>Symbol 
      <select id="symbolSelect">
        <option value="BTCUSDT">BTCUSDT</option>
        <option value="ETHUSDT">ETHUSDT</option>
        <option value="SOLUSDT">SOLUSDT</option>
      </select>
    </label>
    <label>Capital <input type="number" id="capital" value="5000"></label>
    <label>Lots <input type="number" id="defaultLots" value="0.01" step="0.01"></label>
    <label>Target <input type="number" id="targetPts" value="500"></label>
    <label>SL <input type="number" id="slPts" value="250"></label>
    <label>Recovery <input type="number" id="recPts" value="400"></label>
    <label>Total SL (X) <input type="number" id="triggerX" value="5"></label>
    <button id="toggleEngineBtn">Start Paper Trading</button>
  </div>

  <div class="container">
    <div id="chart"></div>
    <div class="sidebar">
      <h3>Live Engine Status</h3>
      <div class="metric"><span>Instance ID:</span> <span id="displayInstanceId" class="metric-value">Strategy_X_5</span></div>
      <div class="metric"><span>State:</span> <span id="engineStatus" class="status-badge status-stopped">STOPPED</span></div>
      <div class="metric"><span>Current Equity:</span> <span id="liveEquity" class="metric-value">$5,000.00</span></div>
      <div class="metric"><span>Active Trade:</span> <span id="liveActiveTrade" class="metric-value">None</span></div>
      <div class="metric"><span>Cumulative SL Count:</span> <span id="liveSLCount" class="metric-value">0</span></div>
      <div class="metric"><span>Last Live Price:</span> <span id="livePrice" class="metric-value">-</span></div>
      
      <h4>Isolated Paper Trade Log</h4>
      <div id="paperLog" style="font-size: 10px; font-family: monospace; max-height: 300px; overflow-y: auto;"></div>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const chartContainer = document.getElementById('chart');
      const chart = LightweightCharts.createChart(chartContainer, {
        layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#2b2f3a' }, horzLines: { color: '#2b2f3a' } },
        timeScale: { timeVisible: true, secondsVisible: false }
      });

      const candleSeries = chart.addCandlestickSeries({
        upColor: '#089981', downColor: '#f23645', borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645'
      });

      let engineInterval = null;
      let isRunning = false;

      function getStorageKey() {
        let id = document.getElementById('strategyId').value.trim() || 'default_strategy';
        return `paper_trading_state_${id}`;
      }

      function loadState() {
        let key = getStorageKey();
        let saved = localStorage.getItem(key);
        if (saved) {
          return JSON.parse(saved);
        }
        return {
          capital: parseFloat(document.getElementById('capital').value) || 5000,
          currentLots: parseFloat(document.getElementById('defaultLots').value) || 0.01,
          direction: 'BUY',
          cumulativeSLCount: 0,
          activeTrade: null,
          trades: []
        };
      }

      let state = loadState();

      // Switch or load state instantly when ID input changes or loses focus
      document.getElementById('strategyId').addEventListener('blur', () => {
        if (isRunning) return; // Don't switch keys while engine is actively running in this tab
        state = loadState();
        document.getElementById('displayInstanceId').innerText = document.getElementById('strategyId').value;
        updateUIStats();
      });

      function updateUIStats() {
        document.getElementById('displayInstanceId').innerText = document.getElementById('strategyId').value;
        document.getElementById('liveEquity').innerText = `$${state.capital.toFixed(2)}`;
        document.getElementById('liveSLCount').innerText = `${state.cumulativeSLCount} / ${document.getElementById('triggerX').value}`;
        
        let activeEl = document.getElementById('liveActiveTrade');
        if (state.activeTrade) {
          activeEl.innerText = `${state.activeTrade.direction} @ $${state.activeTrade.entryPrice} (Lots: ${state.activeTrade.lots})`;
          activeEl.className = 'metric-value green';
        } else {
          activeEl.innerText = 'None (Scanning Background SLs)';
          activeEl.className = 'metric-value';
        }

        let logHtml = '';
        state.trades.slice().reverse().forEach(t => {
          let color = t.outcome === 'WIN' ? '#089981' : '#f23645';
          logHtml += `<div style="border-bottom:1px solid #2a2e39; padding:5px 0; color:${color}">
            <b>[#${t.id}] ${t.direction}</b> | Lots: ${t.lots} | PnL: $${t.pnl.toFixed(2)} (${t.outcome})<br>
            <b>Start:</b> ${t.startTime} @ $${t.startPrice}<br>
            <b>End:</b> ${t.endTime} @ $${t.endPrice}<br>
            <b>Balance:</b> $${t.startBalance.toFixed(2)} ➔ $${t.endBalance.toFixed(2)}
          </div>`;
        });
        document.getElementById('paperLog').innerHTML = logHtml;
        localStorage.setItem(getStorageKey(), JSON.stringify(state));
      }

      async function pollLiveMarket() {
        let symbol = document.getElementById('symbolSelect').value;
        try {
          let res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
          let data = await res.json();
          let currentPrice = parseFloat(data.price);
          document.getElementById('livePrice').innerText = `$${currentPrice.toFixed(2)}`;

          let targetPts = parseFloat(document.getElementById('targetPts').value);
          let slPts = parseFloat(document.getElementById('slPts').value);
          let triggerX = parseInt(document.getElementById('triggerX').value);
          let recPts = parseFloat(document.getElementById('recPts').value);

          if (state.activeTrade) {
            let t = state.activeTrade;
            let hitWin = false;
            let hitLoss = false;

            if (t.direction === 'BUY') {
              if (currentPrice <= t.slPrice) hitLoss = true;
              else if (currentPrice >= t.targetPrice) hitWin = true;
            } else {
              if (currentPrice >= t.slPrice) hitLoss = true;
              else if (currentPrice <= t.targetPrice) hitWin = true;
            }

            if (hitWin || hitLoss) {
              let outcome = hitWin ? 'WIN' : 'LOSS';
              let exitPrice = hitWin ? t.targetPrice : t.slPrice;
              let pnl = t.direction === 'BUY' ? (exitPrice - t.entryPrice) * t.lots : (t.entryPrice - exitPrice) * t.lots;
              
              let startBalance = state.capital;
              state.capital += pnl;

              state.trades.push({
                id: state.trades.length + 1,
                direction: t.direction,
                lots: t.lots,
                startTime: t.startTime,
                startPrice: t.entryPrice,
                endTime: new Date().toISOString().replace('T', ' ').substring(0, 16),
                endPrice: exitPrice,
                startBalance,
                endBalance: state.capital,
                outcome,
                pnl
              });

              if (outcome === 'LOSS') {
                state.currentLots = window.RiskCalculator.calculateNextLots(state.currentLots, pnl, recPts);
                state.direction = t.direction === 'BUY' ? 'SELL' : 'BUY';
                state.cumulativeSLCount++;
              } else {
                state.currentLots = parseFloat(document.getElementById('defaultLots').value);
                state.cumulativeSLCount = 0;
                state.direction = t.direction === 'BUY' ? 'SELL' : 'BUY';
              }

              state.activeTrade = null;
              updateUIStats();
            }
          } else {
            if (state.cumulativeSLCount >= triggerX) {
              state.activeTrade = {
                direction: state.direction,
                lots: state.currentLots,
                entryPrice: currentPrice,
                targetPrice: state.direction === 'BUY' ? currentPrice + targetPts : currentPrice - targetPts,
                slPrice: state.direction === 'BUY' ? currentPrice - slPts : currentPrice + slPts,
                startTime: new Date().toISOString().replace('T', ' ').substring(0, 16)
              };
              updateUIStats();
            }
          }
        } catch (e) {
          console.error("Live ticker error:", e);
        }
      }

      document.getElementById('toggleEngineBtn').addEventListener('click', () => {
        let btn = document.getElementById('toggleEngineBtn');
        let statusBadge = document.getElementById('engineStatus');

        if (!isRunning) {
          isRunning = true;
          btn.innerText = 'Stop Paper Trading';
          btn.className = 'stop-btn';
          statusBadge.innerText = 'RUNNING (24/7 ACTIVE)';
          statusBadge.className = 'status-badge status-running';
          engineInterval = setInterval(pollLiveMarket, 2000);
        } else {
          isRunning = false;
          btn.innerText = 'Start Paper Trading';
          btn.className = '';
          statusBadge.innerText = 'STOPPED';
          statusBadge.className = 'status-badge status-stopped';
          clearInterval(engineInterval);
        }
      });

      state = loadState();
      updateUIStats();
    });
  </script>
</body>
</html>
